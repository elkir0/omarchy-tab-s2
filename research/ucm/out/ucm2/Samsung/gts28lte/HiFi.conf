		cset "name='SPKOUTL Input 1' AIF1RX1"
		cset "name='SPKOUTR Input 1' AIF1RX2"
		cset "name='SPK Switch' on"
		cset "name='Speaker Digital Volume' 123"
		cset "name='SPKOUTL Input 1 Volume' 35"
		cset "name='SPKOUTR Input 1 Volume' 35"
	]

	DisableSequence [
		cset "name='SPKOUT EDRE Switch' off"
		cset "name='SPKOUTL Input 1' AIF1RX1"
