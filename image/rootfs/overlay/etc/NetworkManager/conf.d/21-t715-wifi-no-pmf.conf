# SM-T715: no protected management frames on the brcmfmac interface, client or
# access point. With NetworkManager's default a phone read the Hotspot's password
# as rejected; with ieee80211w=0 it joins. The client link keeps working.
[connection-t715-wifi-no-pmf]
match-device=driver:brcmfmac
wifi-sec.pmf=1
