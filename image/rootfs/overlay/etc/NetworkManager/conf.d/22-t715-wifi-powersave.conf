# SM-T715: Wi-Fi power save on the brcmfmac interface. Omarchy turns it off for
# laptops (omarchy-wifi-powersave.conf, wifi.powersave = 2). On this tablet it
# costs about half a watt with the screen off: 2.26 W with power save off
# against 1.67 W with it on, five minutes each on battery (2026-11-02). The
# price is some latency on incoming traffic while the radio dozes. A named
# section that matches the device comes before the plain [connection] section,
# whatever the order of the files.
[connection-t715-wifi-powersave]
match-device=driver:brcmfmac
wifi.powersave=3
