# SM-T715 test image: log alarm straight into Omarchy's session
# (/usr/local/share/wayland-sessions/omarchy.desktop, from omarchy-settings).
# Relogin: the tablet has no keyboard for SDDM's greeter, so SDDM logs in
# again if the session ends.
[Autologin]
User=alarm
Session=omarchy.desktop
Relogin=true
