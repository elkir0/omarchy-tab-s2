# SM-T715: keep the journal on disk, bounded. On a persistent root
# (the initramfs, rootfs.select "persist=NAME") it survives
# reboots and freezes; in image mode /var/log/journal is in the RAM
# overlay, so the same caps bound its share of the 3 GB of RAM.
[Journal]
Storage=persistent
SystemMaxUse=64M
RuntimeMaxUse=64M
