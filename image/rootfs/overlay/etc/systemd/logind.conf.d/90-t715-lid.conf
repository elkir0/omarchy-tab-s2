# SM-T715 (omarchy-tab-s2; docs/image/ROOTFS.md "Touch layer P1"): the cover's
# Hall sensor reports a lid switch once the device tree has it. The sleep is
# t715-sleep's, its own decision to make (docs/image/ROOTFS.md "Sleep"), not
# logind's, so logind still does nothing with the switch: t715-keys turns
# the screen off and on with the cover, and opening it wakes a sleeping
# tablet.
# Named to sort after Omarchy's drop-ins (10-ignore-power-button.conf,
# 20-inhibit-delay.conf): the last file wins.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
