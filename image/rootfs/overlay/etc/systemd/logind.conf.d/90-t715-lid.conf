# SM-T715 (omarchy-tab-s2; docs/image/ROOTFS.md "Touch layer P1"): the cover's
# Hall sensor reports a lid switch once the device tree has it. Suspend is not
# supported on this tablet (the sleep targets are masked), so logind does
# nothing with it; t715-keys turns the screen off and on with the cover.
# Named to sort after Omarchy's drop-ins (10-ignore-power-button.conf,
# 20-inhibit-delay.conf): the last file wins.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
