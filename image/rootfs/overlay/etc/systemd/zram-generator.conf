# SM-T715: compressed swap in RAM (omarchy-tab-s2). 3 GB of RAM, and the root
# is a RAM overlay whose tmpfs pages can then be swapped out compressed.
# lz4 is the kernel's default compressor (zstd packs ~30 % more but is
# several times slower on the A53s).
[zram0]
zram-size = ram / 2
compression-algorithm = lz4
swap-priority = 100
fs-type = swap
