# SM-T715: card0 is exynos-drm (the panel), card1 is panfrost (render only).
# Aquamarine (Hyprland's backend, also SDDM's greeter compositor through
# start-hyprland) must drive card0. Same value in /etc/environment and in
# ~alarm/.config/uwsm/env (omarchy-tab-s2, docs/image/ROOTFS.md).
[Service]
Environment=AQ_DRM_DEVICES=/dev/dri/card0
