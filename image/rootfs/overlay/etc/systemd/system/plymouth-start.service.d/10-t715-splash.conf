# SM-T715: the Omarchy splash without "splash" on the kernel command line.
# sboot builds the command line and drops the boot image header's; only a
# kernel rebuild (CONFIG_CMDLINE) could add the word.  plymouthd reads the
# command line only to decide splash or details, and takes a fake one.
[Service]
ExecStart=
ExecStart=/usr/bin/plymouthd --mode=boot --pid-file=/run/plymouth/pid --attach-to-session --kernel-command-line="quiet splash"
