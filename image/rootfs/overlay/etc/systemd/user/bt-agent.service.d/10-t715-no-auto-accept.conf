# SM-T715 (omarchy-tab-s2; docs/image/ROOTFS.md "Bluetooth"): Omarchy's
# bt-agent.service (omarchy-settings) registers bt-agent -c NoInputNoOutput,
# which accepts every pairing request. Its comment assumes the adapter is
# pairable only while Omarchy's Bluetooth panel scans; on the tablet BlueZ
# reported "Pairable: yes" while idle, so a nearby device could pair
# without a prompt. The touch shell's quick settings register their own
# agent, omamobile-bt-agent (KeyboardDisplay: it asks), while the Bluetooth
# panel is open.
# A condition that never holds (/dev/null is not a directory), not a mask:
# Omarchy's first run (every boot on this RAM-overlay image) enables the unit
# with five others in one `systemctl --user enable --now`, which fails for all
# six on a masked unit. Enabled, it is skipped at every start.
[Unit]
ConditionPathExists=/dev/null/t715-no-auto-accept
