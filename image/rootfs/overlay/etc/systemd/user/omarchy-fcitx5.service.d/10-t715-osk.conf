# SM-T715 (omarchy-tab-s2, touch layer P1; docs/image/ROOTFS.md): squeekboard,
# the on-screen keyboard, needs Hyprland's input-method slot, which
# Omarchy's fcitx5 would take. A condition, not a mask: Omarchy's first run
# (every boot on this RAM-overlay image) enables the unit with
# `systemctl --user enable --now`, which fails on a masked unit.
# To run fcitx5 anyway (a hardware keyboard with compose sequences; text
# fields then keep the Wayland input method of /etc/environment.d/20-t715-osk.conf):
#   mkdir -p ~/.config/t715-omarchy && touch ~/.config/t715-omarchy/fcitx5
# From omarchy-mobile's systemd/user/omarchy-fcitx5-omamobile.conf (5f7ba48,
# MIT, Copyright (c) 2026 Derek Ross).
[Unit]
ConditionPathExists=%h/.config/t715-omarchy/fcitx5
