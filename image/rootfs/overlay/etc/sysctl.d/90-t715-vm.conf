# SM-T715 (omarchy-tab-s2): zram is cheap swap, prefer it to dropping the
# page cache; no readahead on a RAM swap device.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# The boot image's command line sets loglevel 8: keep the kernel's per-buffer
# exynos_drm import errors off the consoles (the journal still has them).
kernel.printk = 4 4 1 7
