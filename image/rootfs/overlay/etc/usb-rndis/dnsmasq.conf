# dnsmasq instance dedicated to the USB RNDIS debug link.
# Runs from usb-rndis-setup (NOT the system-wide dnsmasq.service), so the
# tablet's regular DNS service stays untouched.
# Corresponding unit: usb-rndis.service

# Bind only to the RNDIS interface; do not touch the system resolver.
interface=usb0
interface=rndis0
except-interface=lo
bind-dynamic

# DHCP: an address for the debugging host, nothing else.  No router
# (option 3) and no DNS server (option 6, and no DNS service at all): with
# them, macOS made this USB link its default route and lost its Internet
# connection (2026-10-28).  An option given without a value is not sent.
port=0
dhcp-range=172.16.42.2,172.16.42.10,255.255.255.0,12h
# Leases in /run, forgotten at each boot.  The gadget gives the host a new
# MAC address at every boot, so on a persistent root a lease file under
# /var/lib/misc kept one 12 h lease per boot until the nine addresses ran
# out and the Mac got none (2026-10-29: "no address available").
dhcp-leasefile=/run/usb-rndis-dnsmasq.leases
dhcp-option=3
dhcp-option=6

# Daemonizes: usb-rndis-setup starts it without '&' (the unit has
# RemainAfterExit=yes).  "keep-in-foreground" takes no value and made
# dnsmasq refuse to start on the first Arch boot.
pid-file=
log-dhcp
