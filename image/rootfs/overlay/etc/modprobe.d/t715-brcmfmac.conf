# SM-T715: the BCM4358 goes back to sleep 100 ms after the last frame, not
# 2 s.  cfg80211's power save timeout is -1 on this kernel (no wireless
# extensions), which brcmfmac turns into its 2000 ms maximum: with a few
# broadcasts a second on the network the chip never slept, 75-120 mW with
# the screen off (docs/hardware/BATTERY.md section 11).  ps_timeout exists
# from kernel #6 (branch t715-power); an older brcmfmac ignores the line.
options brcmfmac ps_timeout=100
