# SM-T715 (omarchy-tab-s2, touch layer P1; docs/image/ROOTFS.md): text fields
# talk to the on-screen keyboard through Wayland's text-input-v3, which
# Hyprland relays to squeekboard (input-method-v2). This file sorts after
# Omarchy's /usr/lib/environment.d/10-omarchy-fcitx.conf, so its values win;
# fcitx5 itself is held off by
# /etc/systemd/user/omarchy-fcitx5.service.d/10-t715-osk.conf, since
# Hyprland serves one input method at a time. environment.d cannot unset a
# variable (an empty value is a syntax error), so the fcitx ones get
# explicit "no input method" values.
# From omarchy-mobile's environment.d/20-omamobile-osk.conf (5f7ba48, MIT,
# Copyright (c) 2026 Derek Ross), without its file-picker settings.
INPUT_METHOD=none
QT_IM_MODULE=wayland
GTK_IM_MODULE=wayland
XMODIFIERS=@im=none
SDL_IM_MODULE=none
