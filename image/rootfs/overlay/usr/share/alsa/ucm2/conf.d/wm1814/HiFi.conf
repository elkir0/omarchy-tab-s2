# HiFi verb of the SM-T715 card: one I2S link (AIF1, PCM device 0) carries
# the speaker or headphone playback and the main microphone capture.
#
# Mixer input volumes: 32 = 0 dB.  Digital volumes: 128 = 0 dB, 0.5 dB a
# step.  The values are the stock ones (LineageOS mixer_paths_0.xml).  The
# headphone jack has no detection yet (left out of the machine driver), so
# both outputs are always offered and the speaker wins on priority.

SectionVerb {
	EnableSequence [
		# AIF1 RX1/RX2 (left/right of the I2S stream) feed both outputs;
		# the pin switches below decide which one is powered.
		cset "name='SPKOUTL Input 1' AIF1RX1"
		cset "name='SPKOUTR Input 1' AIF1RX2"
		cset "name='SPKOUTL Input 1 Volume' 30"
		cset "name='SPKOUTR Input 1 Volume' 29"
		cset "name='HPOUTL Input 1' AIF1RX1"
		cset "name='HPOUTR Input 1' AIF1RX2"
		cset "name='HPOUTL Input 1 Volume' 32"
		cset "name='HPOUTR Input 1 Volume' 32"

		# Main microphone on IN1L (input B of the IN1L mux), with the
		# input high-pass filter against the DC offset, sent to both
		# AIF1 TX slots.
		cset "name='IN1L Mux' B"
		cset "name='IN1L Volume' 30"
		cset "name='IN1L Digital Volume' 128"
		cset "name='IN1L HPF Switch' on"
		cset "name='AIF1TX1 Input 1' IN1L"
		cset "name='AIF1TX2 Input 1' IN1L"
		cset "name='AIF1TX1 Input 1 Volume' 32"
		cset "name='AIF1TX2 Input 1 Volume' 32"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Digital Volume' 126"
		cset "name='Speaker Digital Switch' on"
		cset "name='SPK Switch' on"
	]

	DisableSequence [
		cset "name='SPK Switch' off"
		cset "name='Speaker Digital Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Speaker Digital"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='HPOUT Digital Volume' 119"
		cset "name='HPOUT Digital Switch' on"
		cset "name='HP Switch' on"
	]

	DisableSequence [
		cset "name='HP Switch' off"
		cset "name='HPOUT Digital Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "HPOUT Digital"
	}
}

SectionDevice."Mic" {
	Comment "Main microphone"

	EnableSequence [
		cset "name='Main Mic Switch' on"
	]

	DisableSequence [
		cset "name='Main Mic Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureMixerElem "IN1L Digital"
	}
}
