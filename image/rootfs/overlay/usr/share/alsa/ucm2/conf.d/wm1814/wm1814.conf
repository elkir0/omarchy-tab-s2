# ALSA UCM2 profile for the SM-T715 sound card (WM1814 codec on I2S0,
# machine driver sound/soc/samsung/gts28_wm1814.c, card name "wm1814").
#
# alsa-lib finds it as conf.d/<card driver>/<card driver>.conf; an ASoC card
# with no driver_name takes its name ("samsung,model" in the device tree).
# HiFi mixer values come from the stock LineageOS mixer_paths_0.xml (see
# docs/hardware/AUDIO_M6.md section 7.4); Voice Call values come from the
# stock mixer_paths_rev09.xml (see modem/audio/README.md).

Syntax 4

SectionUseCase."HiFi" {
	File "/conf.d/wm1814/HiFi.conf"
	Comment "Speaker, headphones and main microphone"
}

SectionUseCase."Voice Call" {
	File "/conf.d/wm1814/VoiceCall.conf"
	Comment "Phone call: modem audio bridged inside the codec (AIF2)"
}
