# Voice Call verb of the SM-T715 card (WM1814 codec, machine driver
# sound/soc/samsung/gts28_wm1814.c).
#
# Call audio runs between the Shannon modem (CP) and codec AIF2 on the
# "baseband" codec-to-codec link, inside the codec; the AP only routes it.
# This verb sets inert routes: nothing is powered until the telephony daemon
# turns on 'Modem RX Switch' and 'Modem TX Switch', after it has set
# 'Modem Rate' (8kHz or 16kHz) and the CP has reported that it drives the
# AIF2 clocks.  The daemon turns the switches off before the call ends.
#
# Clock plan (stock mixer_paths_rev09.xml lines 100-120;
# research/modem/research/analysis/voice_audio_design.md section 2):
#   AIF2 at ASYNC rate 1 (8 or 16 kHz, programmed by the link);
#   ISRC2 between ASYNC rate 1 (low side) and ASYNC rate 2 = 48 kHz;
#   ASRC between ASYNC rate 2 (async side) and SYSCLK rate (48 kHz).
# The rates are written before the routes, and the disable sequences clear
# routes only, so no rate field changes while a block runs.  Needs the
# patched wm8998 codec driver ('ASRC RATE 2', 'ASYNC Sample Rate 2',
# 'ASYNCCLK rate 2' in the ISRC rate selectors).
#
# Values come from the stock mixer_paths_rev09.xml (incall_nb/wb paths),
# translated to the mainline control names.  Phase 1: speaker, headphones
# and the main microphone; the stock speakerphone uses the sub microphone,
# which the machine driver does not have yet.

SectionVerb {
	EnableSequence [
		# Clock plan first
		cset "name='ASYNC Sample Rate 2' 48kHz"
		cset "name='ASRC RATE 1' SYNCCLK rate"
		cset "name='ASRC RATE 2' ASYNCCLK rate 2"
		cset "name='ISRC2 FSL' ASYNCCLK rate"
		cset "name='ISRC2 FSH' ASYNCCLK rate 2"
		cset "name='Input Ramp Up' 8ms/6dB"

		# Downlink core: the CP left slot (AIF2RX1) into both ISRC2
		# interpolators, then the ASRC2 pair (rev09 lines 395-398)
		cset "name='ISRC2INT1 Input' AIF2RX1"
		cset "name='ISRC2INT2 Input' AIF2RX1"
		cset "name='ASRC2L Input' ISRC2INT1"
		cset "name='ASRC2R Input' ISRC2INT2"

		# Uplink core: the ASRC1 pair through the ISRC2 decimators into
		# both AIF2 TX slots (rev09 lines 1082-1085); the Mic device
		# feeds ASRC1
		cset "name='ISRC2DEC1 Input' ASRC1L"
		cset "name='ISRC2DEC2 Input' ASRC1R"
		cset "name='AIF2TX1 Input 1' ISRC2DEC1"
		cset "name='AIF2TX2 Input 1' ISRC2DEC2"
		cset "name='AIF2TX1 Input 1 Volume' 32"
		cset "name='AIF2TX2 Input 1 Volume' 32"

		# High-pass filter on the uplink microphone (rev09 lines 62, 88)
		cset "name='LHPF1 Mode' High-pass"
		cset "name='LHPF1 Coefficients' 240,58"
	]

	DisableSequence [
		# Routes off first, uplink then downlink; the rates stay set
		cset "name='AIF2TX1 Input 1' None"
		cset "name='AIF2TX2 Input 1' None"
		cset "name='ISRC2DEC1 Input' None"
		cset "name='ISRC2DEC2 Input' None"
		cset "name='ASRC2L Input' None"
		cset "name='ASRC2R Input' None"
		cset "name='ISRC2INT1 Input' None"
		cset "name='ISRC2INT2 Input' None"

		# Register default, as HiFi expects it
		cset "name='Input Ramp Up' 1ms/6dB"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker (speakerphone)"

	EnableSequence [
		# AP audio (ringback, notifications) stays mixed in
		cset "name='SPKOUTL Input 1' AIF1RX1"
		cset "name='SPKOUTR Input 1' AIF1RX2"
		cset "name='SPKOUTL Input 1 Volume' 32"
		cset "name='SPKOUTR Input 1 Volume' 32"

		# Call downlink (rev09 lines 392-407, gains 1928-1932)
		cset "name='SPKOUTL Input 3' ASRC2L"
		cset "name='SPKOUTR Input 3' ASRC2R"
		cset "name='SPKOUTL Input 3 Volume' 32"
		cset "name='SPKOUTR Input 3 Volume' 32"
		cset "name='Speaker Digital Volume' 128"
		cset "name='Speaker Digital Switch' on"
		cset "name='SPK Switch' on"
	]

	DisableSequence [
		cset "name='SPK Switch' off"
		cset "name='Speaker Digital Switch' off"
		cset "name='SPKOUTL Input 3' None"
		cset "name='SPKOUTR Input 3' None"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Speaker Digital"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (uplink from the main microphone)"

	EnableSequence [
		cset "name='HPOUTL Input 1' AIF1RX1"
		cset "name='HPOUTR Input 1' AIF1RX2"
		cset "name='HPOUTL Input 1 Volume' 32"
		cset "name='HPOUTR Input 1 Volume' 32"

		# Call downlink (rev09 lines 409-429, gains 1943-1950)
		cset "name='HPOUTL Input 2' ASRC2L"
		cset "name='HPOUTR Input 2' ASRC2R"
		cset "name='HPOUTL Input 2 Volume' 32"
		cset "name='HPOUTR Input 2 Volume' 32"
		cset "name='HPOUT Digital Volume' 130"
		cset "name='HPOUT Digital Switch' on"
		cset "name='HP Switch' on"
	]

	DisableSequence [
		cset "name='HP Switch' off"
		cset "name='HPOUT Digital Switch' off"
		cset "name='HPOUTL Input 2' None"
		cset "name='HPOUTR Input 2' None"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "HPOUT Digital"
	}
}

SectionDevice."Mic" {
	Comment "Main microphone"

	EnableSequence [
		# IN1L (input B) through LHPF1 (rev09 lines 1108-1122,
		# gains 2689-2693). The PGA is 3 dB below stock (24): the
		# owner found the uplink a little too sensitive (2026-10-30)
		cset "name='IN1L Mux' B"
		cset "name='IN1L Volume' 21"
		cset "name='IN1L Digital Volume' 128"
		cset "name='LHPF1 Input 1' IN1L"
		cset "name='LHPF1 Input 1 Volume' 32"

		# Uplink: the same microphone on both channels to the CP
		cset "name='ASRC1L Input' LHPF1"
		cset "name='ASRC1R Input' LHPF1"

		# AP capture (call recording) of the same signal
		cset "name='AIF1TX1 Input 1' LHPF1"
		cset "name='AIF1TX2 Input 1' LHPF1"
		cset "name='Main Mic Switch' on"
	]

	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='ASRC1L Input' None"
		cset "name='ASRC1R Input' None"
		cset "name='LHPF1 Input 1' None"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureMixerElem "IN1L Digital"
	}
}
