# SM-T715 (omarchy-tab-s2, t715-idle.service): the screen goes off after two
# minutes without input, the way a short Power press does it: t715-keys turns
# the touchscreen off first, then DPMS (locking first once a PIN is set), and
# the Power key wakes it. Omarchy's stay-awake state holds this timer: while
# ~/.local/state/omarchy/indicators/stay-awake exists (the Stay awake tile,
# `omarchy toggle idle`, an Omarchy update), the timeout does nothing. A
# Wayland idle inhibitor, such as Firefox playing a video, or logind's idle
# inhibitor holds it too. Omarchy's own idle cycle (screensaver, lock) is off:
# its timers are 0 in the tablet profile's shell.json.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 120
    on-timeout = test -e ~/.local/state/omarchy/indicators/stay-awake || systemctl --user kill --kill-whom=main --signal=SIGUSR1 t715-keys.service
}
