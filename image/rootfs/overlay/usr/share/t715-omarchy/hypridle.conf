# SM-T715 (omarchy-tab-s2, t715-idle.service): the screen goes off after two
# minutes without input, the way a short Power press does it: t715-keys turns
# the touchscreen off first, then DPMS, and the Power key wakes it. Nothing
# locks the session (no PIN until the lock is designed). Omarchy's own idle
# cycle (screensaver, lock) stays off with its stay-awake state; a Wayland
# idle inhibitor, such as Firefox playing a video, holds this timer too.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 120
    on-timeout = systemctl --user kill --kill-whom=main --signal=SIGUSR1 t715-keys.service
}
