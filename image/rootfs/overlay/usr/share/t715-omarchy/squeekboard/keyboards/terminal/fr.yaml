# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's terminal/fr.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with the change omarchy-mobile made to
# terminal/us.yaml, for the SM-T715 (omarchy-tab-s2): an Esc key at the start
# of the top row. That row now holds nine keys instead of eight, so
# "small-row" is a ninth of the letter rows' width (10 x 40.41 = 404.1;
# 404.1 / 9 = 44.9) instead of an eighth (50.512), and the rows still line
# up. Linked as ~/.local/share/squeekboard/keyboards/terminal/fr.yaml, the
# only place squeekboard reads layouts from besides its built-in ones.
# Language: French
---
outlines:
    default:       { width: 40.41,   height: 52     }
    action:        { width: 67.35,   height: 52     }
    change-view:   { width: 60.615,  height: 52     }
    change-view-2: { width: 67.35,   height: 52     }
    large:         { width: 60.615,  height: 52     }
    small-row:     { width: 44.9,    height: 27.725 }
    spaceline:     { width: 114.495, height: 52     }
    special:       { width: 40.41,   height: 52     }
    special-2:     { width: 60.615,  height: 52     }
    special-3:     { width: 67.35,   height: 52     }

views:
    base:
        - "Esc-small Tab-small Ctrl Alt Shift ↑ ↓ ← →"
        - "a z e r t y u i o p"
        - "q s d f g h j k l m"
        - "show_upper w x c v b n . BackSpace"
        - "show_numbers show_eschars preferences space show_actions Return"
    upper:
        - "Esc-small Tab-small Ctrl Alt Shift PageUp PageDown Home End"
        - "A Z E R T Y U I O P"
        - "Q S D F G H J K L M"
        - "show_upper W X C V B N , BackSpace"
        - "show_numbers show_eschars preferences space show_actions Return"
    numbers:
        - "Esc-small Tab-small Ctrl Alt Shift ↑ ↓ ← →"
        - "1 2 3 4 5 6 7 8 9 0"
        - "@ # € % & - _ + ( )"
        - "show_symbols , \" ' : ; ! ? BackSpace"
        - "show_letters show_eschars preferences space .-large Return"
    symbols:
        - "Esc-small Tab-small Ctrl Alt Shift ↑ ↓ ← →"
        - "~ ` | · √ π τ ÷ × ¶"
        - "© ® £ $ ¥ ^ ° * { }"
        - "show_numbers \\ / < > = [ ] BackSpace"
        - "show_letters show_eschars preferences space .-large Return"
    eschars:
        - "Esc-small Tab-small Ctrl Alt Shift ↑ ↓ ← →"
        - "à â ç é è ê î ô ù û"
        - "À Â Ç É È Ê Î Ô Ù Û"
        - "show_numbers æ œ ä ë ï ö ü BackSpace"
        - "show_letters show_eschars preferences space .-large Return"
    actions:
        - "Esc-small Tab-small Ctrl Alt Shift PageUp PageDown Home End"
        - "F1  F2  F3  F4  F5  F6"
        - "F7  F8  F9  F10 F11 F12"
        - "Esc Tab Pause Insert Up Del"
        - "show_letters_actions Menu Break Left Down Right"

 
buttons:
    F1:
        outline: "action"
        keysym: "F1"
    F2:
        outline: "action"
        keysym: "F2"
    F3:
        outline: "action"
        keysym: "F3"
    F4:
        outline: "action"
        keysym: "F4"
    F5:
        outline: "action"
        keysym: "F5"
    F6:
        outline: "action"
        keysym: "F6"
    F7:
        outline: "action"
        keysym: "F7"
    F8:
        outline: "action"
        keysym: "F8"
    F9:
        outline: "action"
        keysym: "F9"
    F10:
        outline: "action"
        keysym: "F10"
    F11:
        outline: "action"
        keysym: "F11"
    F12:
        outline: "action"
        keysym: "F12"
    Esc:
        outline: "action"
        keysym: "Escape"
        label: "Echap"
    Tab:
        outline: "action"
        keysym: "Tab"
    Esc-small:
        outline: "small-row"
        keysym: "Escape"
        label: "Echap"
    Tab-small:
        outline: "small-row"
        keysym: "Tab"
        label: "Tab"
    Del:
        outline: "action"
        keysym: "Delete"
        label: "Suppr"
    Insert:
        outline: "action"
        keysym: "Insert"
        label: "Inser"
    Menu:
        outline: "action"
        keysym: "Menu"
    Pause:
        outline: "action"
        keysym: "Pause"
    Break:
        outline: "action"
        keysym: "Break"
        label: "Attn"
    Home:
        outline: "small-row"
        keysym: "Home"
        label: "🡔"
    End:
        outline: "small-row"
        keysym: "End"
        label: "Fin"
    PageUp:
        outline: "small-row"
        keysym: "Page_Up"
        label: "Page ↑"
    PageDown:
        outline: "small-row"
        keysym: "Page_Down"
        label: "Page ↓"
    "↑":
        outline: "small-row"
        keysym: "Up"
    "↓":
        outline: "small-row"
        keysym: "Down"
    "←":
        outline: "small-row"
        keysym: "Left"
    "→":
        outline: "small-row"
        keysym: "Right"
    Up:
        label: "↑"
        outline: "action"
        keysym: "Up"
    Left:
        label: "←"
        outline: "action"
        keysym: "Left"
    Down:
        label: "↓"
        outline: "action"
        keysym: "Down"
    Right:
        label: "→"
        outline: "action"
        keysym: "Right"
    Ctrl:
        modifier: "Control"
        outline: "small-row"
        label: "Ctrl"
    Alt:
        modifier: "Alt"
        outline: "small-row"
        label: "Alt"
    Shift:
        modifier: "Shift"
        outline: "small-row"
        label: "Maj"
    show_actions:
        action:
            set_view: "actions"
        outline: "change-view"
        label: ">_"
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        action: "show_prefs"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_letters_actions:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    show_eschars:
        action:
            locking:
                lock_view: "eschars"
                unlock_view: "base"
        outline: "change-view"
        label: "Ââ"
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
    .-large:
        outline: "large"
        text: "."
