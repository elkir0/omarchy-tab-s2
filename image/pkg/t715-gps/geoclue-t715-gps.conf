# [wifi] enable=false does not stop GeoClue asking a server: it then keeps a GeoIP-only source, seen
# on the tablet as "GeoIP (ichnaea)" at 25 km.  With no network it can only reach gpsd's socket
# and D-Bus, both path-based, and it cannot find an NMEA service on the LAN either.
[Service]
PrivateNetwork=yes
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_NETLINK
