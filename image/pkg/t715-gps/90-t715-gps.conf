# The satellites and nothing else.  GeoClue's other sources ask a server (Wi-Fi, cells) or are not
# a position at all.  This file alone does not keep it offline: geoclue.service.d/t715-gps.conf does.
[network-nmea]
enable=true
nmea-socket=/run/t715-gps/nmea.sock

[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[compass]
enable=false

[static-source]
enable=false

# Let through with Location on; any other app asks through the agent.
[firefox]
allowed=true
system=true
users=

[chromium]
allowed=true
system=true
users=

[geoclue-where-am-i]
allowed=true
system=true
users=
