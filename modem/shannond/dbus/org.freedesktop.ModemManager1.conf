<!--
  D-Bus system bus policy for the shannon2mm facade (shannond started with
  its mm option), which owns org.freedesktop.ModemManager1 in place of
  ModemManager.

  Install as /usr/share/dbus-1/system.d/org.freedesktop.ModemManager1.conf
  (it replaces the file shipped by the modemmanager package, which must not
  be installed or must stay masked: both cannot own the name).

  - only root may own the name (shannond runs as root; if it is moved to a
    dedicated user, duplicate the first <policy> block for that user);
  - root and the desktop user's group (wheel) may call methods, which
    includes reading properties (org.freedesktop.DBus.Properties);
  - everybody may introspect.
  Signals reach every connection, as with any system service.
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>

  <policy context="default">
    <deny own="org.freedesktop.ModemManager1"/>
    <deny send_destination="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
