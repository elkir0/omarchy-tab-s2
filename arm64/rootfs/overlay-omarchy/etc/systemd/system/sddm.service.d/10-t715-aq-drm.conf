# SM-T715: aquamarine (Hyprland's backend, also SDDM's greeter compositor
# through start-hyprland) must drive exynos-drm (the panel), not panfrost
# (render only). By path: on arm64 panfrost probes first and is card0, so
# card0 made Hyprland fail (2026-11-25). Same value in /etc/environment and in
# ~alarm/.config/uwsm/env (omarchy-tab-s2, docs/image/ROOTFS.md).
[Service]
Environment=AQ_DRM_DEVICES=/dev/dri/by-path/platform-exynos-drm-card
