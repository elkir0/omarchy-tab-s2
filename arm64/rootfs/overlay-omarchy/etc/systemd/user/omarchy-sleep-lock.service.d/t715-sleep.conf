# SM-T715: t715-sleep-prepare.service runs for several seconds after logind
# announced the sleep (the CP and the Wi-Fi/Bluetooth chip go down first).
# omarchy-system-sleep-monitor exits once it has locked, to release its
# delay inhibitor, and is restarted: a restart during that window cannot take
# the inhibitor again ("already running") and fails, and five of them in ten
# seconds would leave the unit failed, so that later sleeps no longer lock.
# Wait for logind to finish the sleep before taking the inhibitor again, and
# never stop restarting.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/bin/sh -c "while [ \"$(busctl --system get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager PreparingForSleep 2>/dev/null)\" = \"b true\" ]; do sleep 1; done"
TimeoutStartSec=infinity
