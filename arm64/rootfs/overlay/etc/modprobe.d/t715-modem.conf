# SS333 modem (SM-T715): no automatic load of the modem modules, as on the
# 32-bit image (omarchy-tab-s2 modem/modprobe/t715-modem.conf).  The board
# tree enables SPI4 for the modem's boot link, so udev would load
# spi_s3c64xx at every boot and set the SPI4 pins with the modem unpowered.
# The modem service loads them by name, in order, when it starts the CP
# (modprobe by name still works with a blacklist).  arm64 has no modem
# service yet: nothing loads them.
blacklist exynos5433_mipi_lli
blacklist sec_modem_v1
blacklist spi_s3c64xx
