# arm64: the CP is powered only once this boot has proven itself (KBOOT: up written for the
# loader, the watchdog keeper feeding). A boot that dies before its mark is reset by the
# watchdog with the CP never started: the CP's eFuse window never overlaps a failing boot.
# The 32-bit image has no such mark: there the chain follows udev and the module loading only.
[Unit]
After=t715-kboot-mark.service t715-watchdog-keeper.service
Requisite=t715-kboot-mark.service
